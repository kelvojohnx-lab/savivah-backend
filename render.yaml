databases:
  - name: savivah-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: savivah-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: savivah-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PESAPAL_ENV
        value: sandbox
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_CALLBACK_URL
        sync: false
      - key: PESAPAL_IPN_ID
        sync: false
      - key: FARGO_API_KEY
        sync: false
      - key: FARGO_WEBHOOK_SECRET
        sync: false
